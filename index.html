<style>
/* Design-Tokens gespiegelt aus marcschraepler.com (BaseLayout) */
:root {
  --font-heading: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --radius: 0.65rem;
  --duration: 0.2s;

  --background: #fafafa;
  --foreground: #0a0a0a;
  --card: #ffffff;
  --muted-foreground: #525252;
  --border: #e5e5e5;
  --primary: #2f7192;
  --primary-accent: #246b8e;
  --primary-foreground: #fafafa;
}
@supports (color: oklch(50% 0.1 234)) {
  :root {
    --background: oklch(98.5% 0 none);
    --foreground: oklch(14.5% 0 none);
    --muted-foreground: oklch(43.9% 0 none);
    --border: oklch(92.2% 0 none);
    --primary: oklch(52% 0.085 234);
    --primary-accent: oklch(50% 0.088 234);
    --primary-foreground: oklch(98.5% 0 none);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  background-color: var(--background);
  color: var(--foreground);
  font-family: var(--font-sans);
  line-height: 1.6;
  scroll-behavior: smooth;
  text-size-adjust: none;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
}

.card { width: 100%; max-width: 460px; text-align: center; }

.avatar {
  width: 112px;
  height: 112px;
  margin: 0 auto 28px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--primary-foreground);
  font-family: var(--font-heading);
  font-size: 34px;
  font-weight: 600;
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.06);
}
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

h1 {
  font-family: var(--font-heading);
  font-size: clamp(26px, 6vw, 32px);
  font-weight: 600;
  line-height: 1.15;
  margin-bottom: 10px;
}

.role {
  font-size: 15px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 18px;
}

.bio {
  font-size: 16px;
  line-height: 1.65;
  color: var(--muted-foreground);
  margin-bottom: 28px;
  text-wrap: pretty;
}

.actions { display: flex; flex-direction: column; gap: 10px; }

.button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: 1px solid transparent;
  border-radius: calc(var(--radius) - 0.125rem);
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  transition: color var(--duration), background-color var(--duration), border-color var(--duration), transform var(--duration);
}
.button--primary { background-color: var(--primary); color: var(--primary-foreground); }
.button--primary:hover { background-color: var(--primary-accent); }
.button--outline { background-color: var(--card); border-color: var(--border); color: var(--foreground); }
.button--outline:hover { border-color: var(--primary); color: var(--primary); }
.button:hover { transform: translateY(-1px); }
.button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.arrow { opacity: 0.45; font-size: 13px; transition: opacity var(--duration), transform var(--duration); }
.button:hover .arrow { opacity: 0.9; transform: translateX(2px); }

.meta {
  margin-top: 28px;
  font-size: 13px;
  color: var(--muted-foreground);
}

.lang-switch {
  margin-top: 20px;
  display: flex;
  justify-content: center;
  gap: 6px;
}
.lang-switch button {
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted-foreground);
  background: none;
  border: 1px solid transparent;
  border-radius: calc(var(--radius) - 0.25rem);
  padding: 4px 10px;
  cursor: pointer;
  transition: color var(--duration), border-color var(--duration), background-color var(--duration);
}
.lang-switch button:hover { color: var(--primary); }
.lang-switch button[aria-pressed="true"] { color: var(--primary); border-color: var(--border); background: var(--card); }
.lang-switch button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

@media (prefers-color-scheme: dark) {
  :root {
    --background: #0a0a0a;
    --foreground: #fafafa;
    --card: #171717;
    --muted-foreground: #a1a1a1;
    --border: rgba(250, 250, 250, 0.1);
    --primary: #3c8296;
    --primary-accent: #6bb0c5;
    --primary-foreground: #fafafa;
  }
  @supports (color: oklch(50% 0.1 234)) {
    :root {
      --background: oklch(14.5% 0 none);
      --foreground: oklch(98.5% 0 none);
      --card: oklch(20.5% 0 none);
      --muted-foreground: oklch(70.8% 0 none);
      --primary: oklch(57% 0.076 219);
      --primary-accent: oklch(72% 0.076 219);
    }
  }
  .role, .button--outline:hover { color: var(--primary-accent); }
  .lang-switch button:hover, .lang-switch button[aria-pressed="true"] { color: var(--primary-accent); }
  /* Heller Akzent als Button-Fläche: hält den Kontrast im Dunkelmodus über WCAG AA */
  .button--primary { background-color: var(--primary-accent); color: var(--background); }
  .button--primary:hover { background-color: #8ac9dc; }
  .avatar { background: var(--primary-accent); color: var(--background); box-shadow: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  .button:hover { transform: none; }
  .button:hover .arrow { transform: none; }
}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Marc Schraepler von Gerlach",
  "jobTitle": "Digital Architect",
  "description": "Für Unternehmen ohne eigenes Tech-Team: Ich entscheide, was digital wirklich weiterhilft, und baue die Lösung bis in den laufenden Betrieb.",
  "url": "https://marcschraepler.com/",
  "image": "https://marcschraepler.com/og-image.png",
  "sameAs": [
    "https://marcschraepler.com/",
    "https://www.linkedin.com/in/marcschraepler/"
  ],
  "address": { "@type": "PostalAddress", "addressCountry": "AT" },
  "areaServed": ["AT", "DE", "CH"]
}
</script>

<script>
(function () {
  var STRINGS = {
    de: {
      title: "Marc Schraepler von Gerlach – Digital Architect für den wachsenden Mittelstand",
      description: "Für Unternehmen ohne eigenes Tech-Team: Ich entscheide, was digital wirklich weiterhilft, und baue die Lösung bis in den laufenden Betrieb.",
      role: "Digital Architect für den wachsenden Mittelstand",
      bio: "Für Unternehmen ohne eigenes Tech-Team: Ich entscheide, was digital wirklich weiterhilft, und baue die Lösung bis in den laufenden Betrieb.",
      cta: "Zur Website",
      meta: "Österreich · DACH · Remote"
    },
    en: {
      title: "Marc Schraepler von Gerlach – Digital Architect for the growing Mittelstand",
      description: "For companies without their own tech team: I decide what genuinely helps digitally, and build the solution into daily operations myself.",
      role: "Digital Architect for the growing Mittelstand",
      bio: "For companies without their own tech team: I decide what genuinely helps digitally, and build the solution into daily operations myself.",
      cta: "Visit website",
      meta: "Austria · DACH region · Remote"
    },
    fr: {
      title: "Marc Schraepler von Gerlach – Architecte numérique pour le Mittelstand en croissance",
      description: "Pour les entreprises sans équipe tech interne : je décide ce qui aide vraiment sur le plan numérique, et je construis moi-même la solution jusque dans l'exploitation courante.",
      role: "Architecte numérique pour le Mittelstand en croissance",
      bio: "Pour les entreprises sans équipe tech interne : je décide ce qui aide vraiment sur le plan numérique, et je construis moi-même la solution jusque dans l'exploitation courante.",
      cta: "Voir le site",
      meta: "Autriche · Zone DACH · Télétravail"
    }
  };

  var supported = Object.keys(STRINGS);
  var root = document.documentElement;
  var switchEl = document.querySelector(".lang-switch");
  var descriptionMeta = document.querySelector('meta[name="description"]');

  function applyLang(lang) {
    if (supported.indexOf(lang) === -1) lang = "de";
    var s = STRINGS[lang];
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      if (s[key]) el.textContent = s[key];
    });
    document.title = s.title;
    if (descriptionMeta) descriptionMeta.setAttribute("content", s.description);
    root.setAttribute("lang", lang);
    if (switchEl) {
      switchEl.querySelectorAll("button").forEach(function (btn) {
        btn.setAttribute("aria-pressed", String(btn.getAttribute("data-lang") === lang));
      });
    }
    try { localStorage.setItem("site-lang", lang); } catch (e) {}
  }

  var saved;
  try { saved = localStorage.getItem("site-lang"); } catch (e) {}
  var browserLang = (navigator.language || "de").slice(0, 2);
  applyLang(saved || (supported.indexOf(browserLang) !== -1 ? browserLang : "de"));

  if (switchEl) {
    switchEl.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-lang]");
      if (btn) applyLang(btn.getAttribute("data-lang"));
    });
  }
})();
</script>
